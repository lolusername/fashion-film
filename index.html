<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Audio-Reactive Fashion Video</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Add to your CSS */
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&display=swap');

        .intro-banner {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            text-align: center;
            animation: fadeOut 2s forwards;
            pointer-events: none;
            width: 100%;
            mix-blend-mode: difference;
        }

        .intro-text {
            font-family: 'Bodoni Moda', serif;
            color: white;
            font-size: clamp(1rem, 6vw, 6rem);
            line-height: 0.9;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            position: relative;
            margin: 0;
            padding: 0;
            opacity: 0;
        }

        .intro-text::after {
            display: none;
        }

        .intro-text:nth-child(1) {
            animation: slideIn 0.5s forwards;
        }

        .intro-text:nth-child(2) {
            animation: slideIn 0.5s forwards 0.2s;
        }

        .intro-text:nth-child(3) {
            animation: slideIn 0.5s forwards 0.4s;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateX(-5%);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .intro-text:hover {
            transform: scale(1.02);
            transition: transform 0.3s ease;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        #glCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 50% !important;
            height: 100%;
            z-index: 1;
        }

        .mode-selection {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 20px;
            z-index: 10001;
        }

        .mode-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.8);
            color: white;
            padding: 20px 40px;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Bodoni Moda', serif;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        #webcamContainer {
            position: fixed;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            z-index: 1;
            display: none;
        }

        #webcamVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .capture-btn-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10002;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .capture-btn {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-family: 'Bodoni Moda', serif;
            font-size: 14px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .capture-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .capture-icon {
            font-size: 20px;
            color: #ff3366;
        }

        .capture-text {
            transform: translateY(1px);
        }

        @media (orientation: portrait) {
            #webcamContainer {
                top: 50%;
                right: 0;
                width: 100%;
                height: 50%;
            }
            
            #videosDivider {
                width: 100% !important;
                height: 4px !important;
                cursor: ns-resize !important;
                left: 0 !important;
                transform: translateY(-50%) !important;
            }
            
            #glCanvas {
                height: 50% !important;
            }
        }
    </style>
</head>

<body>
    <canvas id="glCanvas"></canvas>
    <div class="intro-banner">
        <div class="intro-text">FILM</div>
        <div class="intro-text">FASHION</div>
        <div class="intro-text">MONTAGE</div>
    </div>

    <div class="capture-btn-container">
        <button id="captureBtn" class="capture-btn">
            <span class="capture-icon">◉</span>
            <span class="capture-text">CAPTURE MOMENT</span>
        </button>
    </div>

    <div class="mode-selection">
        <button class="mode-btn" id="remixSpace">REMIX SPACE</button>
        <button class="mode-btn" id="remixTime">REMIX TIME</button>
    </div>

    <div id="spaceOptions" style="display: none;" class="mode-selection">
        <button class="mode-btn" id="useWebcamSpace">USE WEBCAM</button>
        <button class="mode-btn" id="uploadVideoSpace">UPLOAD VIDEO</button>
        <input type="file" id="mediaUpload" accept="video/*,image/*" style="display: none;">
    </div>

    <div id="webcamContainer">
        <video id="webcamVideo" autoplay playsinline></video>
    </div>

    <script src="script.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>

</html>
